name: Build SafePass APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Packaging Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libffi-dev gzip zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Install Buildozer & Cython dependencies
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer setuptools wheel

    - name: Generate and Update Buildozer Spec
      run: |
        buildozer init
        sed -i 's/^requirements = .*/requirements = python3, kivy==2.3.0, kivymd==1.2.0, requests, urllib3, chardet, idna, plyer, kivy_garden.mapview/' buildozer.spec
        sed -i 's/^# android.permissions = .*/android.permissions = INTERNET, ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = safepass/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = com.dtech1/' buildozer.spec
        # Force buildozer to accept licenses automatically to avoid pausing
        sed -i 's/^# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec

    - name: Package Android APK
      timeout-minutes: 30 # Gives the massive NDK download up to 30 minutes so it never crashes mid-way
      run: |
        yes | buildozer -v android debug
        
    - name: Upload Finished Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SafePass-APK
        path: bin/*.apk
