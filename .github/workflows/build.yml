- name: Create Clean Explicit Buildozer Config
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = SafePass Tracker
        package.name = safepass
        package.domain = com.dtech1
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 0.1
        # Switch to lightweight requirements
        requirements = python3, flask, jinja2, Werkzeug, itsdangerous, click, requests, urllib3, chardet, idna
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET, ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION
        android.api = 33
        android.minapi = 24
        # Tell Buildozer to use the ultra-stable WebView layout
        android.bootstrap = webview
        android.private_storage = True
        android.accept_sdk_license = True
        log_level = 2
        
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF
